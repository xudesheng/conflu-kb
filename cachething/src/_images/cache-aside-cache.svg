<svg width="420" height="180" xmlns="http://www.w3.org/2000/svg">
  <rect x="170" y="20" width="80" height="40" fill="#e0e7ff" stroke="#333"/>
  <text x="210" y="45" font-size="14" text-anchor="middle" fill="#222">Application</text>
  <rect x="40" y="120" width="80" height="40" fill="#bbf7d0" stroke="#333"/>
  <text x="80" y="145" font-size="14" text-anchor="middle" fill="#222">Cache</text>
  <rect x="300" y="120" width="80" height="40" fill="#fee2e2" stroke="#333"/>
  <text x="340" y="145" font-size="14" text-anchor="middle" fill="#222">Data Store</text>
  <!-- Stage 1: App checks cache -->
  <path d="M210,60 Q130,100 80,120" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="120" y="90" font-size="12" fill="#555">① Check cache</text>
  <!-- Stage 2: Cache miss, app queries data store -->
  <path d="M210,60 Q290,100 340,120" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="300" y="90" font-size="12" fill="#555">② Miss → Query</text>
  <!-- Stage 3: App stores result in cache (from Application to Cache) -->
  <path d="M210,60 Q130,100 80,120" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="120" y="110" font-size="12" fill="#555">③ Store in cache</text>
  <!-- Stage 4: App uses result from cache -->
  <path d="M80,120 Q130,80 210,60" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="120" y="70" font-size="12" fill="#555">④ Use result</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
</svg>
