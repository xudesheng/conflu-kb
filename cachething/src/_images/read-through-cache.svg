<svg width="400" height="120" xmlns="http://www.w3.org/2000/svg">
  <rect x="30" y="20" width="100" height="40" fill="#e0e7ff" stroke="#333"/>
  <text x="80" y="45" font-size="14" text-anchor="middle" fill="#222">Application</text>
  <rect x="160" y="20" width="100" height="40" fill="#bbf7d0" stroke="#333"/>
  <text x="210" y="45" font-size="14" text-anchor="middle" fill="#222">Cache</text>
  <rect x="290" y="20" width="100" height="40" fill="#fee2e2" stroke="#333"/>
