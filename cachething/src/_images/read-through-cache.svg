  <line x1="130" y1="40" x2="160" y2="40" stroke="#333" marker-end="url(#arrow)"/>
  <line x1="260" y1="40" x2="290" y2="40" stroke="#333" marker-end="url(#arrow)"/>
  <line x1="290" y1="60" x2="260" y2="60" stroke="#333" marker-end="url(#arrow)"/>
