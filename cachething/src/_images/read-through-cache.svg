  <text x="145" y="32" font-size="12" text-anchor="middle" fill="#555">get</text>
  <text x="275" y="32" font-size="12" text-anchor="middle" fill="#555">miss</text>
  <text x="275" y="72" font-size="12" text-anchor="middle" fill="#555">load</text>
