<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600">
  <!-- Background Grid -->
  <defs>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#f0f0f0" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Main Sections -->
  <!-- Front-end Section -->
  <rect x="300" y="100" width="150" height="250" fill="white" stroke="#ccc" stroke-width="2"/>
  <text x="325" y="130" font-family="Arial" font-size="16">Front end</text>
  
  <!-- Back-end Section -->
  <rect x="500" y="100" width="300" height="250" fill="white" stroke="#ccc" stroke-width="2"/>
  <text x="580" y="130" font-family="Arial" font-size="16">Back-end services</text>

  <!-- Utility Services Section -->
  <rect x="500" y="380" width="300" height="120" fill="white" stroke="#ccc" stroke-width="2"/>
  <text x="580" y="410" font-family="Arial" font-size="16">Utility services</text>

  <!-- CI/CD Pipeline -->
  <rect x="50" y="200" width="120" height="80" fill="white" stroke="#000" stroke-width="2"/>
  <text x="70" y="245" font-family="Arial" font-size="14">CI/CD Pipelines</text>

  <!-- Icons and Components -->
  <!-- Ingress -->
  <circle cx="350" cy="200" r="25" fill="white" stroke="#007acc" stroke-width="2"/>
  <text x="325" y="205" font-family="Arial" font-size="14">Ingress</text>

  <!-- Services -->
  <g transform="translate(520,180)">
    <!-- Thingworx -->
    <rect width="60" height="30" rx="5" fill="#4285f4"/>
    <text x="5" y="20" fill="white" font-family="Arial" font-size="10">thingworx</text>
    
    <!-- Connection Server -->
    <rect y="40" width="60" height="30" rx="5" fill="#4285f4"/>
    <text x="5" y="60" fill="white" font-family="Arial" font-size="10">conn. server</text>
    
    <!-- Ignite -->
    <rect y="80" width="60" height="30" rx="5" fill="#4285f4"/>
    <text x="5" y="100" fill="white" font-family="Arial" font-size="10">ignite</text>
    
    <!-- Zookeeper -->
    <rect y="120" width="60" height="30" rx="5" fill="#4285f4"/>
    <text x="5" y="140" fill="white" font-family="Arial" font-size="10">zookeeper</text>
  </g>

  <!-- Utility Services -->
  <g transform="translate(520,420)">
    <rect width="60" height="30" rx="5" fill="#34a853"/>
    <text x="5" y="20" fill="white" font-family="Arial" font-size="10">cert-manager</text>
  </g>

  <!-- External Services -->
  <g transform="translate(850,180)">
    <!-- PostgreSQL -->
    <rect width="50" height="50" fill="#336791"/>
    <text x="10" y="30" fill="white" font-family="Arial" font-size="10">DB</text>
    
    <!-- Storage -->
    <rect y="70" width="50" height="50" fill="#4285f4"/>
    <text x="10" y="100" fill="white" font-family="Arial" font-size="10">Storage</text>
  </g>

  <!-- Connections -->
  <!-- Draw arrows -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
  
  <!-- Connection lines -->
  <path d="M 170 240 H 300" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)" fill="none"/>
  <path d="M 375 200 H 500" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)" fill="none"/>
  <path d="M 650 195 H 850" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)" fill="none"/>

  <!-- Virtual Network Border -->
  <rect x="280" y="80" width="600" height="450" fill="none" stroke="#4285f4" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="750" y="510" font-family="Arial" font-size="14" fill="#4285f4">Virtual network</text>
</svg>